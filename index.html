<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARUZ Enterprises</title>
<meta name="description" content="ARUZ Enterprises - developer of Blue World: Play & Explore.">
<style>
  :root {
    --bg: #f5f8fb;
    --card: #ffffff;
    --text: #1b2733;
    --muted: #5b6b7a;
    --accent: #0b6bcb;
    --accent-text: #ffffff;
    --border: #dde5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720;
      --card: #17212c;
      --text: #e6edf3;
      --muted: #9aabbb;
      --accent: #3d95ef;
      --accent-text: #ffffff;
      --border: #2a3846;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  header h1 { margin: 0 0 4px; font-size: 2rem; }
  header p { margin: 0 0 32px; color: var(--muted); }
  .app {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .app h2 { margin: 0 0 8px; font-size: 1.35rem; }
  .app p { margin: 0 0 20px; color: var(--muted); }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    text-decoration: none;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 8px;
  }
  .btn:hover, .btn:focus { opacity: 0.9; }
  footer { margin-top: 32px; font-size: 0.95rem; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>ARUZ Enterprises</h1>
    <p>Mobile games and apps</p>
  </header>

  <section class="app">
    <h2>Blue World: Play &amp; Explore</h2>
    <p>Our game for Android, available on Google Play.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.blueworld.explore" rel="noopener">Get it on Google Play</a>
  </section>

  <footer>
    <p><a href="https://www.termsfeed.com/live/7b4c4413-0176-4630-8bf9-f115f836f8e6" rel="noopener">Privacy Policy</a></p>
    <p>Contact: ARUZ Enterprises, via the developer contact details on our Google Play listing.</p>
    <p>&copy; ARUZ Enterprises</p>
  </footer>
</main>
</body>
</html>
